name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    # stand-alone Windows app as a downloadable artifact (manual trigger or push to main)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pyinstaller --noconfirm evaluation_program.spec
      - uses: actions/upload-artifact@v4
        with:
          name: EvaluationProgram-windows
          path: dist/EvaluationProgram
