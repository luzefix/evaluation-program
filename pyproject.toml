[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-program"
version = "0.1.0"
description = "Evaluation of thin-film growth, characterisation and low-temperature transport data (XRD, RSM, R(T), ...)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
evalprog = "evalprog.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalprog = ["materials/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
